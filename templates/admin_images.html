{% extends "admin_base.html" %}

{% block content %}
<div class="grid">
  <div class="card">
    <h2>Upload Image</h2>
    <form method="POST" enctype="multipart/form-data" action="{{ url_for('admin_images_upload') }}" class="grid">
      <input type="file" name="image_upload" accept="image/*" />
      <button class="btn" type="submit">Upload</button>
    </form>
  </div>

  <div class="card">
    <h2>Image Library</h2>
    {% if not images %}
      <p class="notice">No images uploaded yet.</p>
    {% else %}
      <div class="grid grid-2">
        {% for img in images %}
        <div class="card">
          <img class="thumb" src="{{ url_for('static', filename=img.filename) }}" alt="{{ img.original_name or img.filename }}" />
          <div style="margin-top:8px;">
            <div>{{ img.original_name or img.filename }}</div>
            <form method="POST" action="{{ url_for('admin_images_delete', image_id=img.id) }}">
              <button class="btn btn-danger" type="submit">Delete</button>
            </form>
          </div>
        </div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
