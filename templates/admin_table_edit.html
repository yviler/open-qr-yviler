{% extends "admin_base.html" %}

{% block content %}
<div class="card">
  <h2>Edit Table</h2>
  <form method="POST" action="{{ url_for('admin_tables_update', table_id=table.id) }}" class="grid">
    <div class="form-row">
      <div>
        <label>Table Number</label>
        <input name="table_number" value="{{ table.table_number }}" />
      </div>
      <div>
        <label>Label</label>
        <input name="label" value="{{ table.label or '' }}" />
      </div>
    </div>
    <label><input type="checkbox" name="active" {% if table.active %}checked{% endif %} /> Active</label>
    <div class="form-row">
      <button class="btn" type="submit">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('admin_tables') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
