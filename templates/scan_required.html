<!DOCTYPE html>
<html lang="{{ language|default('id') }}">
<head>
  <meta charset="utf-8" />
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/order.css') }}" />
</head>
<body>
  <header class="hdr">
    <div class="hdr-inner">
      <div class="brand">{{ brand_name }}</div>
      <div class="table-tag">{{ (language=='en' and 'Table' or 'Meja') }} {{ table }}</div>
    </div>
  </header>

  <main class="wrap" style="max-width:720px;padding-top:40px;">
    <section class="card" style="padding:24px;text-align:center;">
      <h1 style="margin-top:0;">{{ title }}</h1>
      <p style="margin-bottom:0;color:#475569;">{{ message }}</p>
    </section>
  </main>
</body>
</html>
